quarkus:
  datasource:
    db-kind: postgresql
    username: ${DB_USER:broder}
    password: ${DB_PASSWORD:broder}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:broder}

  hibernate-orm:
    schema-management:
      strategy: update
    log:
      format-sql: false

  rest-client:
    prometheus:
      url: ${PROMETHEUS_URL:http://localhost:9090}
      connect-timeout: 2000
      read-timeout: 5000

  scheduler:
    enabled: true

  http:
    cors:
      ~: true
      origins: ${CORS_ORIGINS:http://localhost:3000}

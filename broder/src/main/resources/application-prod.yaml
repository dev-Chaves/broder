quarkus:
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:broder}
    password: ${POSTGRES_PASSWORD:broder}
    jdbc:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:broder}

  hibernate-orm:
    schema-management:
      strategy: update
    log:
      format-sql: false

  http:
    cors:
      ~: true
      origins: ${CORS_ORIGINS:http://localhost:3000}

broder:
  webhook:
    timeout-seconds: ${WEBHOOK_TIMEOUT_SECONDS:5}
